[package]
name = "lore-core"
version = "0.62.14"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native LORE memory, beliefs, review and session index"
repository = "https://github.com/docwilde/LORE"
publish = false

[dependencies]
fancy-regex = "0.19.2"
hmac = "0.12"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "limits", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "signal", "macros"] }
