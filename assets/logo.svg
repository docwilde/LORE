<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="lore">
<title>lore</title>
<rect x="0" y="0" width="256" height="256" rx="56" fill="#12141d"/>
<!-- thought trail rising to a forming belief -->
<circle cx="164" cy="66" r="3.5" fill="#f5b942" fill-opacity="0.65"/>
<circle cx="178" cy="48" r="5.5" fill="#f5b942" fill-opacity="0.85"/>
<circle cx="196" cy="28" r="9" fill="none" stroke="#f5b942" stroke-width="5.5"/>
<!-- the reader: solid blob, twin-wink eyes -->
<rect x="76" y="72" width="104" height="58" rx="26" fill="#f5b942"/>
<circle cx="110" cy="101" r="7.5" fill="#12141d"/>
<circle cx="146" cy="101" r="7" fill="none" stroke="#12141d" stroke-width="5"/>
<!-- the open tome, dashed page lines -->
<g stroke="#f5b942" stroke-width="7" fill="none" stroke-linejoin="round">
  <rect x="50" y="152" width="72" height="50" rx="9"/>
  <rect x="134" y="152" width="72" height="50" rx="9"/>
</g>
<g stroke="#f5b942" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.55" stroke-dasharray="7 8">
  <path d="M64 170 H108 M64 184 H108"/>
  <path d="M148 170 H192 M148 184 H192"/>
</g>
</svg>
