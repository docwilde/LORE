<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="lore">
  <title>lore — memory for Claude Code</title>
  <!-- badge -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#12141d"/>
  <!-- belief store: faint satellites, one linked by a dashed edge (derived, uncurated) -->
  <g stroke="#f5b942" stroke-opacity="0.30" stroke-width="4" fill="none">
    <path d="M84 124 L152 88" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path d="M84 124 L178 128" stroke-dasharray="2 9" stroke-linecap="round"/>
  </g>
  <g fill="#f5b942">
    <circle cx="152" cy="88" r="7" fill-opacity="0.45"/>
    <circle cx="178" cy="128" r="5" fill-opacity="0.35"/>
    <circle cx="196" cy="76" r="4" fill-opacity="0.22"/>
  </g>
  <!-- curated core: the L, solid nodes on solid edges -->
  <g stroke="#f5b942" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M84 64 L84 184 L188 184"/>
  </g>
  <g fill="#f5b942">
    <circle cx="84" cy="124" r="13"/>
    <circle cx="84" cy="184" r="13"/>
    <circle cx="140" cy="184" r="13"/>
    <circle cx="188" cy="184" r="13"/>
  </g>
  <!-- staged proposal: hollow node, not yet part of the core -->
  <circle cx="84" cy="64" r="12" fill="#12141d" stroke="#f5b942" stroke-width="7"/>
</svg>
